<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — gymAI</title>
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="logo">gymAI</a>
    <ul class="nav-links">
      <li><a href="index.html#como-funciona">Como funciona</a></li>
      <li><a href="index.html#recursos">Recursos</a></li>
      <li><a href="index.html#stats">Resultados</a></li>
    </ul>
    <div class="nav-actions">
      <a href="cadastro.html">Criar conta</a>
    </div>
  </nav>
</header>

<main class="auth">
  <section class="auth-card">
    <h1>Entrar no gymAI</h1>
    <p>Acesse sua conta para continuar seu plano de treino.</p>

    <form action="#" method="post">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
      </div>

      <div class="field-row">
        <label for="lembrar">
          <input type="checkbox" id="lembrar" name="lembrar">
          Lembrar de mim
        </label>
        <a href="recuperar-senha.html">Esqueci minha senha</a>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <div class="divider">
      <span>ou</span>
    </div>

    <div class="social-login">
      <button type="button">Entrar com Google</button>
      <button type="button">Entrar com Apple</button>
    </div>

    <p class="auth-footer">
      Ainda não tem conta?
      <a href="cadastro.html">Criar conta grátis</a>
    </p>
  </section>
</main>

<footer>
  <div class="logo">gymAI</div>
  <ul class="foot-links">
    <li><a href="index.html#como-funciona">Como funciona</a></li>
    <li><a href="index.html#recursos">Recursos</a></li>
    <li><a href="entrar.html">Entrar</a></li>
    <li><a href="#">Contato</a></li>
  </ul>
</footer>

</body>
</html>
